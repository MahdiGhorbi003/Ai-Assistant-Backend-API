services:
  db:
    image: postgres:16
    container_name: ai-assistant-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    container_name: ai-assistant-api-container

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db

volumes:
  postgres_data: